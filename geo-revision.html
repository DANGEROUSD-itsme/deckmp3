function donutSVG() {

          '<ul class="space-y-2">' + q.rubric.map(r => '<li class="text-[12.5px] text-ink-300 leading-relaxed flex gap-2"><span class="text-brand-400">▪</span><span>' + r + '</span></li>').join('') + '</ul></div>' +
          '<div class="rounded-ctl bg-ink-950/60 border border-pos-400/25 p-3"><p class="text-[11px] uppercase tracking-wide text-pos-400 font-semibold mb-2">Model answer</p>' +
          q.model.split('\n\n').map(p => '<p class="text-[12.5px] text-ink-300 leading-relaxed mb-2">' + p + '</p>').join('') + '</div>' +
        '</div>' : '') +
    '</div>').join('');

  const partC = '<div class="' + CARD + '">' +
      '<p class="text-[14px] text-ink-100 font-medium leading-relaxed mb-1">' + PART_C.question + '</p>' +
      '<p class="text-[12px] text-ink-400 mb-4">12 marks — Impacts (6) + Sustainability strategies (4) + Structure / TEET coherence (2)</p>' +
      PART_C.parts.map(p =>
        '<div class="mb-4"><div class="flex flex-wrap items-center gap-2 mb-2">' +
          '<span class="' + CHIP + ' bg-brand-500/15 text-brand-200 border border-brand-400/30">' + p.marks + ' marks</span>' +
          '<span class="text-[13.5px] font-semibold text-ink-100">' + p.name + '</span>' +
          '<label class="ml-auto flex items-center gap-2 text-[12px] text-ink-400">Self-marked ' + markSelect('c', p.id, p.marks, t.cSelf[p.id] || 0) + '</label></div>' +
        '<p class="text-[12px] text-ink-400 mb-2">' + p.prompt + '</p>' +
        (p.id === 'structure' ? '' :
          '<textarea data-pc="' + p.id + '" rows="7" placeholder="Write this section of your extended response here…" ' +
          'class="w-full rounded-ctl bg-ink-950/70 border border-ink-700 p-3 text-[13.5px] text-ink-100 placeholder-ink-500 leading-relaxed focus:border-brand-400">' + esc(t.cText[p.id] || '') + '</textarea>') +
        '</div>').join('') +
      '<button data-pcex="1" class="' + BTN_PRIMARY + '"><i data-lucide="award" class="w-4 h-4"></i>' +
        (t.exemplar ? 'Hide perfect-score exemplar' : 'Reveal perfect-score exemplar') + '</button>' +
      (t.exemplar ? exemplarHTML() : '') +
    '</div>';

  $('#view-test').innerHTML = pageHead('test', 'clipboard-check', 'Mock Test — ' + EXAM.total + ' marks in ' + EXAM.duration + ' minutes',
    'The timer starts the moment you interact with this page. Part A is marked automatically; Parts B and C are self-marked against the rubrics and exemplar provided.') +

    '<div class="card rounded-card p-4 sticky top-16 z-30 mb-6 backdrop-blur-xl" style="background:rgba(12,17,28,.97)">' +
      '<div class="flex flex-wrap items-center gap-x-6 gap-y-2">' +
        '<div class="flex items-center gap-2"><i data-lucide="timer" class="w-4 h-4 text-brand-300"></i>' +
        '<span id="test-timer" class="font-mono font-bold text-lg text-ink-100">' + fmtTime(t.remaining) + '</span>' +
        '<span class="text-[11px] text-ink-500">remaining</span></div>' +
        '<div class="flex items-center gap-2"><i data-lucide="calculator" class="w-4 h-4 text-brand-300"></i>' +
        '<span id="test-tally" class="font-semibold text-ink-100 text-[14px]">' + sc.total + ' / ' + EXAM.total + ' marks</span></div>' +
        '<span id="test-subtally" class="text-[12px] text-ink-400">Part A ' + sc.a + '/12 · Part B ' + sc.b + '/13 · Part C ' + sc.c + '/12</span>' +
        '<div class="w-full h-1.5 rounded-full bg-ink-800 overflow-hidden mt-1"><div id="test-progress" class="h-full bg-brand-500 rounded-full transition-all duration-250" style="width:' +
          (Object.keys(t.a).length / PART_A.length * 100) + '%"></div></div>' +
      '</div>' +
      '<div id="test-timeup" class="' + (t.lockedAB ? '' : 'hidden ') + 'mt-3 rounded-ctl border border-neg-400/40 bg-neg-500/10 p-3 text-[12.5px] text-neg-400">' +
        'Time is up — Parts A and B have been submitted and their answers revealed. Part C stays open so you can finish writing your extended response.</div>' +
    '</div>' +

    '<h2 class="text-[15px] font-bold text-ink-100 mb-1">Part A — Multiple Choice <span class="text-ink-400 font-normal">(12 marks)</span></h2>' +
    '<p class="text-[12.5px] text-ink-400 mb-4">Select one answer per question. Feedback appears immediately and your answer locks in.</p>' +
    '<div class="grid gap-4 mb-8">' + PART_A.map(partAQuestionHTML).join('') + '</div>' +

    '<h2 class="text-[15px] font-bold text-ink-100 mb-1">Part B — Short Answer &amp; Data Analysis <span class="text-ink-400 font-normal">(13 marks)</span></h2>' +
    '<p class="text-[12.5px] text-ink-400 mb-4">These answers are <strong class="text-ink-200">self-marked</strong> — write your response first, then reveal the rubric and model answer and award yourself marks honestly.</p>' +
    '<div class="grid gap-4 mb-8">' + partB + '</div>' +

    '<h2 class="text-[15px] font-bold text-ink-100 mb-1">Part C — Extended Response <span class="text-ink-400 font-normal">(12 marks)</span></h2>' +
    '<p class="text-[12.5px] text-ink-400 mb-4">Also <strong class="text-ink-200">self-marked</strong> against the exemplar. Aim for T.E.E.T in every paragraph.</p>' +
    partC +

    '<div class="flex flex-wrap gap-2 mt-6">' +
      '<button data-test="finish" class="' + BTN_PRIMARY + '"><i data-lucide="flag" class="w-4 h-4"></i>Finish &amp; score my test</button>' +
      '<button data-test="reset" class="' + BTN_GHOST + '"><i data-lucide="rotate-ccw" class="w-4 h-4"></i>Reset test</button>' +
    '</div><div id="test-summary" class="mt-4"></div>';
  icons();
  updateTestBar();
}
function exemplarHTML() {
  const legend = [['T','Topic sentence','tag-T'], ['E1','Explanation','tag-E1'], ['E2','Example','tag-E2'], ['T2','Tie-back','tag-T2']];
  return '<div class="mt-4 rounded-ctl bg-ink-950/60 border border-warn-400/25 p-4">' +
    '<p class="text-[11px] uppercase tracking-wide text-warn-400 font-semibold mb-3">Perfect-score exemplar — 12/12</p>' +
    '<div class="flex flex-wrap gap-2 mb-4">' + legend.map(l =>
      '<span class="' + CHIP + ' ' + l[2] + ' text-ink-100">' + l[0].replace(/\d/, '') + ' — ' + l[1] + '</span>').join('') + '</div>' +
    PART_C.exemplar.map(p =>
      '<div class="mb-5"><p class="text-[12px] uppercase tracking-wide text-brand-300 font-semibold mb-2">' + p.heading + '</p>' +
      '<p class="text-[13.5px] text-ink-200 leading-[1.9]">' + p.body.map(seg =>
        '<span class="tag-' + seg.tag + ' px-0.5">' + seg.text + '</span>').join(' ') + '</p></div>').join('') +
    '<p class="text-[12px] text-ink-500">Notice that every paragraph completes the full T.E.E.T cycle and that each Example carries specific data — that is what separates a 12/12 from a mid-range response.</p></div>';
}
function finishTest() {
  const sc = testScores();
  if (state.test.timerId) clearInterval(state.test.timerId);
  state.test.finished = true;
  const pcts = [
    { id:'A', pct: sc.a / 12, label:'Part A — Multiple Choice', score: sc.a + '/12',
      nudge:'Re-read the Study Notes modules on core definitions, connection criteria and the ICT case studies, then run the “Core Definitions” and “ICT Case Studies” flashcard decks.' },
    { id:'B', pct: sc.b / 13, label:'Part B — Short Answer & Data Analysis', score: sc.b + '/13',
      nudge:'Revisit the Transport & Global Logistics module — especially the Toyota supply chain and the Figure 1 trade-flow reasoning — then drill the “Car Supply Chain” flashcard deck.' },
    { id:'C', pct: sc.c / 12, label:'Part C — Extended Response', score: sc.c + '/12',
      nudge:'Work through the Paris case study module and the “Paris Key Statistics” and “Paris Strategies” decks, then build all three paragraphs in the TEET Builder.' }
  ];
  const weakest = pcts.slice().sort((x, y) => x.pct - y.pct)[0];
  const pct = Math.round(sc.total / EXAM.total * 100);
  $('#test-summary').innerHTML = '<div class="' + CARD + '">' +
    '<div class="flex flex-wrap items-end gap-4 mb-4">' +
      '<div><p class="text-[12px] uppercase tracking-wide text-ink-400">Total score</p>' +
      '<p class="text-3xl font-bold text-ink-100">' + sc.total + ' <span class="text-lg text-ink-400">/ ' + EXAM.total + '</span></p></div>' +
      '<span class="' + CHIP + ' ' + (pct >= 75 ? 'bg-pos-500/15 text-pos-400 border border-pos-400/30' : pct >= 50 ? 'bg-warn-500/15 text-warn-400 border border-warn-400/30' : 'bg-neg-500/15 text-neg-400 border border-neg-400/30') + '">' + pct + '%</span>' +
    '</div>' +
    '<div class="grid gap-3 md:grid-cols-3 mb-4">' + pcts.map(p =>
      '<div class="card-soft rounded-ctl p-3"><p class="text-[12px] text-ink-400">' + p.label + '</p>' +
      '<p class="text-lg font-bold text-ink-100 mb-2">' + p.score + '</p>' + bar(p.pct * 100, p.pct >= .75 ? '#43c78f' : p.pct >= .5 ? '#e0a044' : '#e14a6d') + '</div>').join('') + '</div>' +
    '<div class="rounded-ctl bg-ink-950/60 border border-brand-400/25 p-4 flex gap-3">' +
      '<i data-lucide="compass" class="w-4 h-4 text-brand-300 shrink-0 mt-0.5"></i>' +
      '<p class="text-[13px] text-ink-300 leading-relaxed"><strong class="text-ink-100">Revise next: ' + weakest.label + '.</strong> ' + weakest.nudge + '</p></div>' +
    '<div class="flex flex-wrap gap-2 mt-4">' +
      '<button data-nav="notes" class="' + BTN_GHOST + '"><i data-lucide="book-open" class="w-4 h-4"></i>Open Study Notes</button>' +
      '<button data-nav="flashcards" class="' + BTN_GHOST + '"><i data-lucide="layers" class="w-4 h-4"></i>Open Flashcards</button>' +
      '<button data-nav="teet" class="' + BTN_GHOST + '"><i data-lucide="pen-line" class="w-4 h-4"></i>Open TEET Builder</button>' +
    '</div></div>';
  icons();
  $('#test-summary').scrollIntoView({ behavior:'smooth', block:'center' });
}

/* ============================== EVENT WIRING ============================== */
document.addEventListener('click', e => {
  const hit = sel => e.target.closest(sel);
  let n;

  if ((n = hit('[data-nav]'))) { setView(n.dataset.nav); return; }

  if ((n = hit('[data-acc]'))) {
    const box = n.closest('.acc');
    const open = box.classList.toggle('is-open');
    n.setAttribute('aria-expanded', open ? 'true' : 'false');
    return;
  }

  /* --- Toyota supply chain --- */
  if ((n = hit('[data-ty-mode]'))) { state.supply.mode = n.dataset.tyMode; state.supply.revealed = {}; renderToyota(); return; }
  if ((n = hit('[data-ty-all]'))) {
    const on = n.dataset.tyAll === '1';
    state.supply.revealed = {};
    if (on) TRANSPORT.toyota.rows.forEach((_, i) => state.supply.revealed[i] = true);
    renderToyota(); return;
  }
  if ((n = hit('[data-ty-reset]'))) { state.supply.quiz = {}; state.supply.revealed = {}; renderToyota(); return; }
  if ((n = hit('[data-ty-q]'))) { state.supply.quiz[n.dataset.tyQ] = Number(n.dataset.v); state.supply.revealed[n.dataset.tyQ] = false; renderToyota(); return; }
  if ((n = hit('[data-ty]'))) { const i = n.dataset.ty; state.supply.revealed[i] = !state.supply.revealed[i]; renderToyota(); return; }

  /* --- Flashcards --- */
  if ((n = hit('[data-deck]'))) { state.deckId = n.dataset.deck; state.cardPos = 0; renderFlashcards(); return; }
  if ((n = hit('[data-mark]'))) { markCard(n.dataset.mark); return; }
  if ((n = hit('[data-fc]'))) {
    const a = n.dataset.fc;
    if (a === 'prev') moveCard(-1);
    else if (a === 'next') moveCard(1);
    else if (a === 'shuffle') {
      const d = currentDeck(), o = deckOrder(d).slice();
      for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; }
      state.order[d.id] = o; state.cardPos = 0; renderCardArea();
    } else if (a === 'filter') { state.filterLearning = !state.filterLearning; state.cardPos = 0; renderFlashcards(); }
    return;
  }
  if (hit('#fc-card')) { flipCard(); return; }

  /* --- TEET builder --- */
  if ((n = hit('[data-teetq]'))) { state.teet.qid = n.dataset.teetq; state.teet.compiled = ''; renderTeet(); return; }
  if ((n = hit('[data-hint]'))) { const k = n.dataset.hint; state.teet.hints[k] = !state.teet.hints[k]; renderTeet(); return; }
  if ((n = hit('[data-teet]'))) {
    const a = n.dataset.teet;
    if (a === 'compile') compileTeet();
    else if (a === 'clear') { state.teet.boxes[state.teet.qid] = { t:'', e1:'', e2:'', t2:'' }; state.teet.compiled = ''; renderTeet(); }
    else if (a === 'download') downloadTeet();
    else if (a === 'copy') {
      navigator.clipboard.writeText(state.teet.compiled).then(
        () => { $('#teet-msg').textContent = 'Copied to clipboard.'; },
        () => { $('#teet-msg').textContent = 'Copy blocked by the browser — select the text and copy manually.'; }
      );
    }
    return;
  }

  /* --- Mock test --- */
  if ((n = hit('[data-pa]'))) {
    if (state.test.lockedAB) return;
    const i = Number(n.dataset.pa);
    if (state.test.a[i] !== undefined) return;
    state.test.a[i] = Number(n.dataset.opt);
    $('#pa-' + i).outerHTML = partAQuestionHTML(PART_A[i], i);
    icons(); updateTestBar(); return;
  }
  if ((n = hit('[data-pbreveal]'))) { const i = n.dataset.pbreveal; state.test.bRevealed[i] = !state.test.bRevealed[i]; renderTest(); return; }
  if (hit('[data-pcex]')) { state.test.exemplar = !state.test.exemplar; renderTest(); return; }
  if (hit('[data-test="finish"]')) { finishTest(); return; }
  if (hit('[data-test="reset"]')) {
    if (state.test.timerId) clearInterval(state.test.timerId);
    state.test = { started:false, remaining: EXAM.duration*60, timerId:null, lockedAB:false, finished:false,
                   a:{}, bText:{}, bRevealed:{}, bSelf:{}, cText:{}, cSelf:{}, exemplar:false };
    renderTest(); return;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-box]')) {
    const k = t.dataset.box;
    teetBoxes()[k] = t.value;
    $('#count-' + k).textContent = words(t.value) + ' words · ' + t.value.length + ' characters';
    if (t.value.trim()) { $('#box-' + k).classList.remove('ring-2', 'ring-neg-400/60'); $('#err-' + k).textContent = ''; }
    return;
  }
  if (t.matches('[data-pb]')) { state.test.bText[t.dataset.pb] = t.value; return; }
  if (t.matches('[data-pc]')) { state.test.cText[t.dataset.pc] = t.value; return; }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (!t.matches('[data-self]')) return;
  if (t.dataset.self === 'b') state.test.bSelf[t.dataset.i] = Number(t.value);
  else state.test.cSelf[t.dataset.i] = Number(t.value);
  updateTestBar();
});

/* Timer starts on the first interaction inside the Mock Test view */
$('#view-test').addEventListener('pointerdown', startTimer);
$('#view-test').addEventListener('keydown', startTimer);

/* Keyboard support for the flashcard deck */
document.addEventListener('keydown', e => {
  if (state.view !== 'flashcards') return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); moveCard(1); }
  else if (e.key === 'ArrowLeft')  { e.preventDefault(); moveCard(-1); }
});

/* ================================= BOOT ================================= */
function boot() {
  renderNav();
  renderDashboard();
  renderNotes();
  renderFlashcards();
  renderTeet();
  renderTest();
  setView('dashboard');
  icons();
}
boot();
</script>
</body>
</html>
